<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#47B8E0"/>
      <stop offset="45%" stop-color="#6DBF6D"/>
      <stop offset="100%" stop-color="#3D8C3D"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8E0C9"/>
      <stop offset="100%" stop-color="#D6CEAF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Monitor body -->
  <rect x="2" y="1" width="28" height="23" rx="2" fill="url(#bezel)"/>

  <!-- Inner bevel shadow -->
  <rect x="4" y="3" width="24" height="15" rx="1" fill="#7F7758"/>

  <!-- Mid bevel -->
  <rect x="5" y="4" width="22" height="13" rx="0.5" fill="#B1A98A"/>

  <!-- Screen -->
  <rect x="6" y="5" width="20" height="11" fill="url(#screen)"/>

  <!-- Power LED -->
  <rect x="22" y="20" width="5" height="2" rx="0.5" fill="#95F41D"/>
  <!-- LED glow -->
  <rect x="22" y="20" width="5" height="2" rx="0.5" fill="#95F41D" opacity="0.4" filter="url(#glow)"/>

  <!-- Stand neck -->
  <rect x="12" y="24" width="8" height="3" rx="0.5" fill="#B1A98A"/>

  <!-- Stand base -->
  <rect x="9" y="27" width="14" height="3" rx="1.5" fill="url(#bezel)" stroke="#B1A98A" stroke-width="0.5"/>
</svg>
